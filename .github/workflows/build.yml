name: Build n8n chinese editor-ui docker image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # 每小时检查一次
  # 可选，未来支持 repository_dispatch 事件自动触发

env:
  UPSTREAM_REPO: other-blowsnow/n8n-i18n-chinese

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 获取上游最新 Release
      id: get_release
      run: |
        latest_release=$(curl -s https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest)
        tag=$(echo "$latest_release" | jq -r .tag_name)
        asset_url=$(echo "$latest_release" | jq -r '.assets[] | select(.name|endswith(".tar.gz")) | .browser_download_url')
        echo "tag=$tag" >> $GITHUB_OUTPUT
        echo "asset_url=$asset_url" >> $GITHUB_OUTPUT

    - name: 规范化版本号
      id: normalize_version
      run: |
        release_tag=${{ steps.get_release.outputs.tag }}
        case "$release_tag" in
          release/*)
            n8n_version="${release_tag#release/}"
            ;;
          n8n@*)
            n8n_version="${release_tag#n8n@}"
            ;;
          *)
            n8n_version="$release_tag"
            ;;
        esac

        if [ -z "$n8n_version" ] || [[ ! "$n8n_version" =~ ^[0-9]+(\.[0-9]+)*([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "无法从上游 tag 推导 n8n 版本: $release_tag"
          exit 1
        fi

        echo "n8n_version=$n8n_version" >> $GITHUB_OUTPUT

    - name: 检查是否已发布过
      id: check_tag
      run: |
        tag=${{ steps.get_release.outputs.tag }}
        if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
          echo "Tag $tag 已存在，跳过"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: 退出如果已发布
      if: steps.check_tag.outputs.exists == 'true'
      run: |
        echo "Release 已存在，终止 workflow."
        exit 0

    - name: 下载上游 release 文件
      run: |
        mkdir src-dist
        curl -L "${{ steps.get_release.outputs.asset_url }}" -o src-dist/editor-ui.tar.gz

    - name: 解压 dist
      run: |
        tar -xzvf src-dist/editor-ui.tar.gz -C src-dist

    - name: 生成 Dockerfile
      run: |
        N8N_VERSION=${{ steps.normalize_version.outputs.n8n_version }}
        cat <<EOF > Dockerfile
        FROM n8nio/n8n:$N8N_VERSION
        COPY src-dist/dist /usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist
        EOF

    - name: 构建镜像
      run: |
        N8N_VERSION=${{ steps.normalize_version.outputs.n8n_version }}
        VERSION_IMAGE=hotwa/n8n-chinese:$N8N_VERSION
        LATEST_IMAGE=hotwa/n8n-chinese:latest
        docker build -t $VERSION_IMAGE -t $LATEST_IMAGE .

    - name: 登录 DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 推送镜像
      run: |
        N8N_VERSION=${{ steps.normalize_version.outputs.n8n_version }}
        VERSION_IMAGE=hotwa/n8n-chinese:$N8N_VERSION
        LATEST_IMAGE=hotwa/n8n-chinese:latest
        docker push $VERSION_IMAGE
        docker push $LATEST_IMAGE
